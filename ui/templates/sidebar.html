{{define "sidebar"}}
<aside class="sidebar" id="sidebar" aria-label="Primary navigation">
  <div class="sidebar-header">
    <a class="wordmark" href="/ui" aria-label="Kafkaesque Dashboard">Kafkaesque</a>
    <button class="icon-button drawer-close" id="drawer-close" type="button" aria-label="Close navigation">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <nav class="nav-list" aria-label="Kafkaesque pages">
    <a class="nav-item{{if eq .Active "dashboard"}} active{{end}}" href="/ui"{{if eq .Active "dashboard"}} aria-current="page"{{end}} aria-label="Dashboard">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-item{{if eq .Active "consumer-groups"}} active{{end}}" href="/ui/consumer-groups"{{if eq .Active "consumer-groups"}} aria-current="page"{{end}} aria-label="Consumer Groups">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-4 2.3-6 5.5-6s5 2 5.5 6M16 5.5a3 3 0 0 1 0 5.5M16 13c2.7.3 4.2 2.3 4.5 6"/></svg>
      <span>Consumer Groups</span>
    </a>
    <a class="nav-item{{if eq .Active "topics"}} active{{end}}" href="/ui/topics"{{if eq .Active "topics"}} aria-current="page"{{end}} aria-label="Topics">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="7" cy="6" r="1"/><circle cx="13" cy="12" r="1"/><circle cx="18" cy="18" r="1"/></svg>
      <span>Topics</span>
    </a>
    <a class="nav-item{{if eq .Active "brokers"}} active{{end}}" href="/ui/brokers"{{if eq .Active "brokers"}} aria-current="page"{{end}} aria-label="Brokers">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="6" rx="1"/><rect x="4" y="15" width="16" height="6" rx="1"/><path d="M8 6h.01M8 18h.01M12 9v6"/></svg>
      <span>Brokers</span>
    </a>
    <a class="nav-item{{if eq .Active "cluster-health"}} active{{end}}" href="/ui/cluster-health"{{if eq .Active "cluster-health"}} aria-current="page"{{end}} aria-label="Cluster Health">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.2 8.4 8 10 4.8-1.6 8-5 8-10V6l-8-3Z"/><path d="m8 12 2.5 2.5L16 9"/></svg>
      <span>Cluster Health</span>
    </a>
    {{if .ShowSettings}}<a class="nav-item{{if eq .Active "settings"}} active{{end}}" href="/ui/settings"{{if eq .Active "settings"}} aria-current="page"{{end}} aria-label="Settings">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21h-4v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3.1 14H3v-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3.1V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span>Settings</span>
    </a>{{end}}
  </nav>

  <div class="sidebar-footer">
    <p class="sidebar-note">Read-only Kafka observability</p>
    {{if .Username}}<div class="sidebar-account">
      <span class="account-label">Logged in as</span>
      <strong>{{.Role}}</strong>
      <span class="account-role">Role: {{.Role}}</span>
      <form method="post" action="/ui/logout">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <button class="logout-button" type="submit" aria-label="Log out {{.Role}}">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg>
          <span>Log out</span>
        </button>
      </form>
    </div>{{end}}
  </div>
</aside>

<div class="drawer-overlay" id="drawer-overlay" hidden></div>
{{end}}
