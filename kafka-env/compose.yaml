x-kafka-environment: &kafka-environment
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:29093,2@broker-2:29093,3@broker-3:29093,4@broker-4:29093,5@broker-5:29093
  KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9090,PLAINTEXT://:19092
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

x-kafka-service: &kafka-service
  image: apache/kafka:4.3.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 30s

services:
  broker-1:
    <<: *kafka-service
    hostname: broker-1
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9090,PLAINTEXT://broker-1:19092

  broker-2:
    <<: *kafka-service
    hostname: broker-2
    ports:
      - "127.0.0.1:9095:9090"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9095,PLAINTEXT://broker-2:19092

  broker-3:
    <<: *kafka-service
    hostname: broker-3
    ports:
      - "127.0.0.1:9096:9090"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9096,PLAINTEXT://broker-3:19092

  broker-4:
    <<: *kafka-service
    hostname: broker-4
    ports:
      - "127.0.0.1:9097:9090"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9097,PLAINTEXT://broker-4:19092

  broker-5:
    <<: *kafka-service
    hostname: broker-5
    ports:
      - "127.0.0.1:9098:9090"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 5
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9098,PLAINTEXT://broker-5:19092

  init:
    image: apache/kafka:4.3.0
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      broker-4:
        condition: service_healthy
      broker-5:
        condition: service_healthy
    volumes:
      - ./provision.sh:/opt/kafkaesque/provision.sh:ro
    entrypoint: ["/bin/bash", "/opt/kafkaesque/provision.sh"]
    restart: "no"
