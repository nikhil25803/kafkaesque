version: 2

project_name: kafkaesque

builds:
  - id: kafkaesque
    main: ./cmd/kafkaesque
    binary: kafkaesque
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/nikhil25803/kafkaesque/internals.Version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - kafkaesque
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
