name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            extension: ""
          - platform: macOS
            os: macos-latest
            extension: ""
          - platform: windows
            os: windows-latest
            extension: .exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build Kafkaesque
        shell: bash
        run: go build -o kafkaesque${{ matrix.extension }} ./cmd/kafkaesque
      - name: Run Kafkaesque help
        shell: bash
        run: ./kafkaesque${{ matrix.extension }} --help
