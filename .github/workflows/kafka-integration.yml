name: Kafka Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kafka-integration:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start Kafka fixture
        run: make kafka-ci-up
      - name: Start consumer activity simulator
        run: make kafka-ci-simulator-start
      - name: Build Kafkaesque
        run: make build
      - name: Test Kafkaesque against fixture
        shell: bash
        run: |
          set -euo pipefail
          config="kafka-env/kafkaesque.yaml"
          api_log="${RUNNER_TEMP}/kafkaesque-api.log"
          api_pid=""
          cleanup_api() {
            if [[ -n "${api_pid}" ]]; then
              kill "${api_pid}" 2>/dev/null || true
              wait "${api_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup_api EXIT

          test "$(./bin/kafkaesque --config "${config}" --check config)" = "Configuration is valid"
          connection="$(./bin/kafkaesque --config "${config}" --check conn)"
          grep -q "Status: CONNECTED" <<<"${connection}"
          grep -q "Protocol: PLAINTEXT" <<<"${connection}"

          metadata="$(./bin/kafkaesque --config "${config}" --metadata)"
          grep -q "STATUS: CONNECTED" <<<"${metadata}"
          grep -Eq "Brokers:[[:space:]]+2" <<<"${metadata}"

          brokers="$(./bin/kafkaesque --config "${config}" --brokers)"
          grep -q "2 brokers available" <<<"${brokers}"

          topics="$(./bin/kafkaesque --config "${config}" --topics)"
          grep -q "orders" <<<"${topics}"
          grep -q "payments" <<<"${topics}"
          grep -q "6 topics available" <<<"${topics}"
          grep -Eq "orders[[:space:]]+External[[:space:]]+6[[:space:]]+2" <<<"${topics}"

          partitions="$(./bin/kafkaesque --config "${config}" --partitions --topic orders)"
          grep -q "Topic: orders" <<<"${partitions}"
          test "$(grep -Ec '^[0-9]+[[:space:]]+broker-' <<<"${partitions}")" -eq 6
          grep -q "REPLICAS" <<<"${partitions}"
          grep -q "STATUS" <<<"${partitions}"

          consumer=""
          consumer_ready=false
          for _ in {1..30}; do
            if consumer="$(./bin/kafkaesque --config "${config}" --consumer --member --group order-processor)" &&
              grep -q "State: STABLE" <<<"${consumer}" &&
              grep -Eq '[1-9][0-9]* assigned partitions' <<<"${consumer}"; then
              consumer_ready=true
              break
            fi
            sleep 2
          done
          printf '%s\n' "${consumer}"
          test "${consumer_ready}" = true
          grep -q "Lag Summary" <<<"${consumer}"
          grep -q "Healthy Partitions:" <<<"${consumer}"
          grep -q "Warning Partitions:" <<<"${consumer}"
          grep -q "Unhealthy Partitions:" <<<"${consumer}"
          grep -Eq '[1-9][0-9]* assigned partitions' <<<"${consumer}"

          health=""
          health_ready=false
          for _ in {1..30}; do
            if health="$(./bin/kafkaesque --config "${config}" --health 2>&1)" &&
              grep -q "Status: HEALTHY" <<<"${health}"; then
              health_ready=true
              break
            fi
            sleep 2
          done
          printf '%s\n' "${health}"
          test "${health_ready}" = true
          grep -q "CLUSTER" <<<"${health}"
          grep -q "Brokers:" <<<"${health}"
          grep -q "Topics:" <<<"${health}"
          grep -q "Partitions:" <<<"${health}"
          grep -q "Consumer Groups:" <<<"${health}"
          grep -q "PARTITIONS" <<<"${health}"
          grep -q "Offline:" <<<"${health}"
          grep -q "Under-replicated:" <<<"${health}"
          grep -q "CONSUMERS" <<<"${health}"
          grep -q "Rebalancing:" <<<"${health}"
          grep -q "Dead:" <<<"${health}"
          grep -q "Lagging:" <<<"${health}"

          structured="$(./bin/kafkaesque --config "${config}" --brokers --topics --output json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data["brokers"]) == 2; assert any(topic["name"] == "orders" for topic in data["topics"])' <<<"${structured}"

          ./bin/kafkaesque serve --config "${config}" --port 18085 >"${api_log}" 2>&1 &
          api_pid=$!
          api_ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18085/api/v1/health >"${RUNNER_TEMP}/uptime.json"; then
              api_ready=true
              break
            fi
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              cat "${api_log}"
              exit 1
            fi
            sleep 1
          done
          test "${api_ready}" = true
          curl --fail --silent http://127.0.0.1:18085/ >"${RUNNER_TEMP}/root.json"
          curl --fail --silent http://127.0.0.1:18085/ui >"${RUNNER_TEMP}/dashboard.html"
          curl --fail --silent http://127.0.0.1:18085/ui/consumer-groups >"${RUNNER_TEMP}/consumer-groups.html"
          curl --fail --silent 'http://127.0.0.1:18085/ui/consumer-groups?page=2' >"${RUNNER_TEMP}/consumer-groups-page-2.html"
          curl --fail --silent --header 'HX-Request: true' 'http://127.0.0.1:18085/ui/consumer-groups?q=service&state=Stable' >"${RUNNER_TEMP}/consumer-groups-fragment.html"
          curl --fail --silent http://127.0.0.1:18085/ui/consumer-groups/orders-service >"${RUNNER_TEMP}/consumer-lag.html"
          curl --fail --silent --header 'HX-Request: true' 'http://127.0.0.1:18085/ui/consumer-groups/orders-service?topic=payments&group_by=member&sort=lag&direction=desc' >"${RUNNER_TEMP}/partition-lag-fragment.html"
          curl --fail --silent http://127.0.0.1:18085/ui/topics >"${RUNNER_TEMP}/topics.html"
          curl --fail --silent 'http://127.0.0.1:18085/ui/topics?page=3' >"${RUNNER_TEMP}/topics-page-3.html"
          curl --fail --silent --header 'HX-Request: true' 'http://127.0.0.1:18085/ui/topics?q=state&level=internal' >"${RUNNER_TEMP}/topics-fragment.html"
          curl --fail --silent http://127.0.0.1:18085/ui/brokers >"${RUNNER_TEMP}/ui-brokers.html"
          curl --fail --silent --header 'HX-Request: true' 'http://127.0.0.1:18085/ui/brokers?q=rack-b' >"${RUNNER_TEMP}/brokers-fragment.html"
          curl --fail --silent http://127.0.0.1:18085/ui/assets/app.css >"${RUNNER_TEMP}/app.css"
          curl --fail --silent http://127.0.0.1:18085/ui/assets/app.js >"${RUNNER_TEMP}/app.js"
          curl --fail --silent http://127.0.0.1:18085/ui/assets/htmx-4.0.0.min.js >"${RUNNER_TEMP}/htmx.min.js"
          grep -q "Demo data" "${RUNNER_TEMP}/dashboard.html"
          grep -q "orders-service" "${RUNNER_TEMP}/dashboard.html"
          grep -q "1–10 of 17 groups" "${RUNNER_TEMP}/consumer-groups.html"
          grep -q "11–17 of 17 groups" "${RUNNER_TEMP}/consumer-groups-page-2.html"
          grep -q 'id="consumer-groups-results"' "${RUNNER_TEMP}/consumer-groups-fragment.html"
          grep -q "shipping-service" "${RUNNER_TEMP}/consumer-groups-fragment.html"
          test "$(grep -c '<!doctype html>' "${RUNNER_TEMP}/consumer-groups-fragment.html")" -eq 0
          grep -q "Maximum Partition Lag" "${RUNNER_TEMP}/consumer-lag.html"
          grep -q "Members and assignments" "${RUNNER_TEMP}/consumer-lag.html"
          grep -q 'Partition lag · payments' "${RUNNER_TEMP}/partition-lag-fragment.html"
          grep -q 'consumer-1 · order-worker' "${RUNNER_TEMP}/partition-lag-fragment.html"
          test "$(grep -c '<!doctype html>' "${RUNNER_TEMP}/partition-lag-fragment.html")" -eq 0
          grep -q "1–10 of 24 topics" "${RUNNER_TEMP}/topics.html"
          grep -q "21–24 of 24 topics" "${RUNNER_TEMP}/topics-page-3.html"
          grep -q '__transaction_state' "${RUNNER_TEMP}/topics-fragment.html"
          test "$(grep -c '<!doctype html>' "${RUNNER_TEMP}/topics-fragment.html")" -eq 0
          grep -q "1–3 of 3 brokers" "${RUNNER_TEMP}/ui-brokers.html"
          grep -q 'broker-2.kafka.local:9092' "${RUNNER_TEMP}/brokers-fragment.html"
          test "$(grep -c '<!doctype html>' "${RUNNER_TEMP}/brokers-fragment.html")" -eq 0
          grep -q -- "--canvas: #050505" "${RUNNER_TEMP}/app.css"
          grep -q "event.key === 'Escape'" "${RUNNER_TEMP}/app.js"
          grep -q "var htmx=" "${RUNNER_TEMP}/htmx.min.js"
          curl --fail --silent http://127.0.0.1:18085/api/v1/metadata/connection >"${RUNNER_TEMP}/connection.json"
          curl --fail --silent http://127.0.0.1:18085/api/v1/metadata/cluster >"${RUNNER_TEMP}/cluster.json"
          curl --fail --silent http://127.0.0.1:18085/api/v1/health/cluster >"${RUNNER_TEMP}/health.json"
          curl --fail --silent http://127.0.0.1:18085/api/v1/consumers/groups >"${RUNNER_TEMP}/groups.json"
          curl --fail --silent http://127.0.0.1:18085/api/v1/topics/orders/partitions >"${RUNNER_TEMP}/partitions.json"
          curl --fail --silent http://127.0.0.1:18085/api/v1/brokers >"${RUNNER_TEMP}/brokers.json"
          python3 -c 'import json,os; root=os.environ["RUNNER_TEMP"]; load=lambda name: json.load(open(os.path.join(root,name),encoding="utf-8")); discovery=load("root.json"); docs=[load(name) for name in ("uptime.json","connection.json","cluster.json","health.json","groups.json","partitions.json","brokers.json")]; assert discovery == {"success":True,"status":200,"data":{"name":"Kafkaesque","api":"/api/v1","health":"/api/v1/health","ui":"/ui"}}; assert all(doc["success"] is True and doc["status"] == 200 and "data" in doc for doc in docs); uptime,connection,cluster,health,groups,partitions,brokers=docs; assert uptime["data"]["status"] == "UP"; assert connection["data"]["status"] == "CONNECTED"; assert cluster["data"]["broker_count"] == 2; assert health["data"]["status"] in ("HEALTHY", "DEGRADED"); assert groups["meta"]["total_items"] >= 1; assert len(partitions["data"]) == 6; assert len(brokers["data"]) == 2'
      - name: Show Kafka diagnostics
        if: failure()
        run: make kafka-ci-diagnostics
      - name: Stop Kafka fixture
        if: always()
        run: make kafka-ci-down
