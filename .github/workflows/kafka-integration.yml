name: Kafka Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kafka-integration:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kafkaesque
          POSTGRES_USER: kafkaesque
          POSTGRES_PASSWORD: kafkaesque-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kafkaesque -d kafkaesque"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Start Kafka fixture
        run: make kafka-ci-up
      - name: Start consumer activity simulator
        run: make kafka-ci-simulator-start
      - name: Build Kafkaesque
        run: make build
      - name: Test Kafkaesque against fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          config="dev/kafka/kafkaesque.yaml"
          api_log="${RUNNER_TEMP}/kafkaesque-api.log"
          api_pid=""
          super_admin_password="$(printf '%s%s%s%s%s' A a 1 _ "$(openssl rand -hex 24)")"
          alerts_encryption_key="$(openssl rand -base64 32)"

          report_error() {
            printf 'Integration check failed at line %s: %s\n' "$1" "$2" >&2
          }

          cleanup_api() {
            if [[ -n "${api_pid}" ]]; then
              kill "${api_pid}" 2>/dev/null || true
              wait "${api_pid}" 2>/dev/null || true
            fi
          }

          trap 'report_error "${LINENO}" "${BASH_COMMAND}"' ERR
          trap cleanup_api EXIT

          printf '\n== CLI checks ==\n'
          test "$(./bin/kafkaesque --config "${config}" --check config)" = "Configuration is valid"
          connection="$(./bin/kafkaesque --config "${config}" --check conn)"
          grep -q "Status: CONNECTED" <<<"${connection}"
          grep -q "Protocol: PLAINTEXT" <<<"${connection}"

          metadata="$(./bin/kafkaesque --config "${config}" --metadata)"
          grep -q "STATUS: CONNECTED" <<<"${metadata}"
          grep -Eq "Brokers:[[:space:]]+2" <<<"${metadata}"

          brokers="$(./bin/kafkaesque --config "${config}" --brokers)"
          grep -q "2 brokers available" <<<"${brokers}"

          topics="$(./bin/kafkaesque --config "${config}" --topics)"
          grep -q "orders" <<<"${topics}"
          grep -q "payments" <<<"${topics}"
          grep -q "6 topics available" <<<"${topics}"
          grep -Eq "orders[[:space:]]+External[[:space:]]+6[[:space:]]+2" <<<"${topics}"

          partitions="$(./bin/kafkaesque --config "${config}" --partitions --topic orders)"
          grep -q "Topic: orders" <<<"${partitions}"
          test "$(grep -Ec '^[0-9]+[[:space:]]+broker-' <<<"${partitions}")" -eq 6
          grep -q "REPLICAS" <<<"${partitions}"
          grep -q "STATUS" <<<"${partitions}"

          consumer=""
          consumer_ready=false
          for _ in {1..30}; do
            if consumer="$(./bin/kafkaesque --config "${config}" --consumer --member --group order-processor)" &&
              grep -q "State: STABLE" <<<"${consumer}" &&
              grep -Eq '[1-9][0-9]* assigned partitions' <<<"${consumer}"; then
              consumer_ready=true
              break
            fi
            sleep 2
          done
          printf '%s\n' "${consumer}"
          test "${consumer_ready}" = true
          grep -q "Lag Summary" <<<"${consumer}"
          grep -q "Healthy Partitions:" <<<"${consumer}"
          grep -q "Warning Partitions:" <<<"${consumer}"
          grep -q "Unhealthy Partitions:" <<<"${consumer}"
          grep -Eq '[1-9][0-9]* assigned partitions' <<<"${consumer}"

          health=""
          health_ready=false
          for _ in {1..30}; do
            if health="$(./bin/kafkaesque --config "${config}" --health 2>&1)" &&
              grep -q "Status: HEALTHY" <<<"${health}"; then
              health_ready=true
              break
            fi
            sleep 2
          done
          printf '%s\n' "${health}"
          test "${health_ready}" = true
          grep -q "CLUSTER" <<<"${health}"
          grep -q "Brokers:" <<<"${health}"
          grep -q "Topics:" <<<"${health}"
          grep -q "Partitions:" <<<"${health}"
          grep -q "Consumer Groups:" <<<"${health}"
          grep -q "PARTITIONS" <<<"${health}"
          grep -q "Offline:" <<<"${health}"
          grep -q "Under-replicated:" <<<"${health}"
          grep -q "CONSUMERS" <<<"${health}"
          grep -q "Rebalancing:" <<<"${health}"
          grep -q "Dead:" <<<"${health}"
          grep -q "Lagging:" <<<"${health}"

          structured="$(./bin/kafkaesque --config "${config}" --brokers --topics --output json)"
          python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data["brokers"]) == 2; assert any(topic["name"] == "orders" for topic in data["topics"])' <<<"${structured}"

          printf '\n== Server startup ==\n'
          KAFKAESQUE_DATABASE_URL='postgres://kafkaesque:kafkaesque-ci@127.0.0.1:5432/kafkaesque?sslmode=disable' \
          KAFKAESQUE_AUTHENTICATION_SUPER_ADMIN_USERNAME=super_admin \
          KAFKAESQUE_AUTHENTICATION_SUPER_ADMIN_EMAIL=super-admin@example.com \
          KAFKAESQUE_AUTHENTICATION_SUPER_ADMIN_PASSWORD="${super_admin_password}" \
          KAFKAESQUE_ALERTS_ENCRYPTION_KEY="${alerts_encryption_key}" \
          KAFKAESQUE_AUTHENTICATION_COOKIE_SECURE=false \
            ./bin/kafkaesque serve --config "${config}" --port 18085 >"${api_log}" 2>&1 &
          api_pid=$!
          api_ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18085/api/v1/health >"${RUNNER_TEMP}/uptime.json"; then
              api_ready=true
              break
            fi
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              cat "${api_log}"
              exit 1
            fi
            sleep 1
          done
          test "${api_ready}" = true

          printf '\n== Authentication ==\n'
          command curl --silent --show-error --fail-with-body http://127.0.0.1:18085/ >"${RUNNER_TEMP}/root.json"
          unauthorized_status="$(command curl --silent --show-error --output "${RUNNER_TEMP}/unauthorized.json" --write-out '%{http_code}' http://127.0.0.1:18085/api/v1/metadata/connection)"
          test "${unauthorized_status}" -eq 401
          python3 -c 'import json,sys; body=json.load(open(sys.argv[1],encoding="utf-8")); assert body["success"] is False; assert body["status"] == 401; assert body["data"] is None' "${RUNNER_TEMP}/unauthorized.json"
          cookie_jar="${RUNNER_TEMP}/cookies.txt"
          command curl --silent --show-error --fail-with-body --cookie-jar "${cookie_jar}" --data-urlencode username=super_admin --data-urlencode password="${super_admin_password}" --data-urlencode next=/ui http://127.0.0.1:18085/ui/login >/dev/null
          curl() { command curl --silent --show-error --fail-with-body --cookie "${cookie_jar}" "$@"; }

          printf '\n== UI smoke check ==\n'
          curl http://127.0.0.1:18085/ui >"${RUNNER_TEMP}/dashboard.html"
          curl http://127.0.0.1:18085/ui/assets/app.css >"${RUNNER_TEMP}/app.css"
          curl http://127.0.0.1:18085/ui/assets/app.js >"${RUNNER_TEMP}/app.js"
          curl http://127.0.0.1:18085/ui/assets/htmx-4.0.0.min.js >"${RUNNER_TEMP}/htmx.min.js"
          grep -q "order-processor" "${RUNNER_TEMP}/dashboard.html"
          grep -q "Cluster Health" "${RUNNER_TEMP}/dashboard.html"
          grep -q "Consumer Groups" "${RUNNER_TEMP}/dashboard.html"
          grep -q -- "--canvas: #050505" "${RUNNER_TEMP}/app.css"
          grep -q "event.key === 'Escape'" "${RUNNER_TEMP}/app.js"
          grep -q "var htmx=" "${RUNNER_TEMP}/htmx.min.js"

          printf '\n== API validation ==\n'
          curl http://127.0.0.1:18085/api/v1/metadata/connection >"${RUNNER_TEMP}/connection.json"
          curl http://127.0.0.1:18085/api/v1/metadata/cluster >"${RUNNER_TEMP}/cluster.json"
          curl http://127.0.0.1:18085/api/v1/health/cluster >"${RUNNER_TEMP}/health.json"
          curl http://127.0.0.1:18085/api/v1/consumers/groups >"${RUNNER_TEMP}/groups.json"
          curl http://127.0.0.1:18085/api/v1/topics/orders/partitions >"${RUNNER_TEMP}/partitions.json"
          curl http://127.0.0.1:18085/api/v1/brokers >"${RUNNER_TEMP}/brokers.json"
          python3 -c 'import json,os; root=os.environ["RUNNER_TEMP"]; load=lambda name: json.load(open(os.path.join(root,name),encoding="utf-8")); discovery=load("root.json"); docs=[load(name) for name in ("uptime.json","connection.json","cluster.json","health.json","groups.json","partitions.json","brokers.json")]; assert discovery == {"success":True,"status":200,"data":{"name":"Kafkaesque","api":"/api/v1","health":"/api/v1/health","ui":"/ui"}}; assert all(doc["success"] is True and doc["status"] == 200 and "data" in doc for doc in docs); uptime,connection,cluster,health,groups,partitions,brokers=docs; assert uptime["data"]["status"] == "UP"; assert connection["data"]["status"] == "CONNECTED"; assert cluster["data"]["broker_count"] == 2; assert health["data"]["status"] in ("HEALTHY", "DEGRADED"); assert groups["meta"]["total_items"] >= 1; assert len(partitions["data"]) == 6; assert len(brokers["data"]) == 2'
      - name: Show Kafka diagnostics
        if: failure()
        run: make kafka-ci-diagnostics
      - name: Stop Kafka fixture
        if: always()
        run: make kafka-ci-down
