name: Kafka Auth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth:
    name: Kafka Auth / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TCP
            mode: tcp
            protocol: PLAINTEXT
            mechanism: PLAIN
            client_auth: none
          - name: TLS
            mode: tls
            protocol: SSL
            mechanism: PLAIN
            client_auth: none
          - name: mTLS
            mode: mtls
            protocol: SSL
            mechanism: PLAIN
            client_auth: required
          - name: SASL PLAIN
            mode: plain
            protocol: SASL_PLAINTEXT
            mechanism: PLAIN
            client_auth: none
          - name: SASL SSL PLAIN
            mode: sasl_ssl_plain
            protocol: SASL_SSL
            mechanism: PLAIN
            client_auth: none
          - name: SCRAM SHA-256
            mode: scram_256
            protocol: SASL_SSL
            mechanism: SCRAM-SHA-256
            client_auth: none
          - name: SCRAM SHA-512
            mode: scram_512
            protocol: SASL_SSL
            mechanism: SCRAM-SHA-512
            client_auth: none
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generate test certificates
        run: bash kafka-env/auth/generate-certificates.sh kafka-env/auth/certificates
      - name: Start isolated Kafka fixture
        env:
          AUTH_PROTOCOL: ${{ matrix.protocol }}
          SASL_MECHANISM: ${{ matrix.mechanism }}
          SSL_CLIENT_AUTH: ${{ matrix.client_auth }}
        run: docker compose -f kafka-env/compose.auth.yaml up -d --wait broker
      - name: Provision SCRAM credentials
        if: startsWith(matrix.mode, 'scram_')
        env:
          SCRAM_MECHANISM: ${{ matrix.mechanism }}
        run: >-
          docker compose -f kafka-env/compose.auth.yaml exec -T broker
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:19092 --alter
          --add-config "${SCRAM_MECHANISM}=[iterations=4096,password=secret]"
          --entity-type users --entity-name kafkaesque
      - name: Build Kafkaesque
        run: make build
      - name: Check successful authentication
        env:
          AUTH_MODE: ${{ matrix.mode }}
        run: |
          bash kafka-env/auth/write-config.sh "${AUTH_MODE}" secret certificates/ca.pem kafka-env/auth/success.yaml
          output="$(./bin/kafkaesque --config kafka-env/auth/success.yaml --check)"
          grep -q "Status: CONNECTED" <<<"${output}"
          grep -q "Protocol: ${{ matrix.protocol }}" <<<"${output}"
      - name: Check authentication failure exit code
        env:
          AUTH_MODE: ${{ matrix.mode }}
        run: |
          timeout_server_pid=""
          cleanup_timeout_server() {
            if [[ -n "${timeout_server_pid}" ]]; then
              kill "${timeout_server_pid}" 2>/dev/null || true
              wait "${timeout_server_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup_timeout_server EXIT

          case "${AUTH_MODE}" in
            tcp)
              ready_dir="$(mktemp -d "${RUNNER_TEMP}/kafkaesque-timeout.XXXXXX")"
              ready_file="${ready_dir}/ready"
              READY_FILE="${ready_file}" python3 -c 'import os,socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(("127.0.0.1",19093)); s.listen(); open(os.environ["READY_FILE"],"w").close(); c,_=s.accept(); time.sleep(10)' &
              timeout_server_pid=$!
              for _ in {1..50}; do
                [[ -f "${ready_file}" ]] && break
                if ! kill -0 "${timeout_server_pid}" 2>/dev/null; then
                  wait "${timeout_server_pid}" || true
                  echo "TCP timeout server exited before becoming ready" >&2
                  exit 1
                fi
                sleep 0.1
              done
              if [[ ! -f "${ready_file}" ]]; then
                echo "TCP timeout server did not become ready within 5 seconds" >&2
                exit 1
              fi
              printf 'kafka:\n  bootstrap_servers: [127.0.0.1:19093]\n  connection_timeout: 1s\n' >kafka-env/auth/failure.yaml
              expected=3
              ;;
            tls)
              bash kafka-env/auth/write-config.sh tls secret certificates/invalid-ca.pem kafka-env/auth/failure.yaml
              expected=2
              ;;
            mtls)
              bash kafka-env/auth/write-config.sh tls secret certificates/ca.pem kafka-env/auth/failure.yaml
              expected=2
              ;;
            *)
              bash kafka-env/auth/write-config.sh "${AUTH_MODE}" invalid certificates/ca.pem kafka-env/auth/failure.yaml
              expected=2
              ;;
          esac
          set +e
          output="$(./bin/kafkaesque --config kafka-env/auth/failure.yaml --check 2>&1)"
          actual=$?
          set -e
          printf 'Expected exit code: %s\nActual exit code: %s\n%s\n' "${expected}" "${actual}" "${output}"
          if [[ "${actual}" -ne "${expected}" ]]; then
            echo "Unexpected Kafkaesque exit code" >&2
            exit 1
          fi
          if ! grep -q "Exit code: ${expected}" <<<"${output}"; then
            echo "Kafkaesque output did not contain the expected exit code" >&2
            exit 1
          fi
      - name: Show Kafka diagnostics
        if: failure()
        run: docker compose -f kafka-env/compose.auth.yaml logs --no-color broker
      - name: Stop Kafka fixture
        if: always()
        run: docker compose -f kafka-env/compose.auth.yaml down --volumes --remove-orphans
