name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Publish GitHub release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install:
    name: Install / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: publish
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install and run Kafkaesque
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}" INSTALL_DIR="${RUNNER_TEMP}/bin" sh ./install.sh
          "${RUNNER_TEMP}/bin/kafkaesque" --help
      - name: Install and run Kafkaesque
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          $installDir = Join-Path $env:RUNNER_TEMP "bin"
          & .\install.ps1 -Version $env:GITHUB_REF_NAME -InstallDir $installDir
          & (Join-Path $installDir "kafkaesque.exe") --help
